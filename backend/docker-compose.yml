services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: edutrace
      POSTGRES_USER: edutrace
      POSTGRES_PASSWORD: edutrace
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutrace"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: edutrace
      MINIO_ROOT_PASSWORD: change-this-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  api:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
  worker:
    build: .
    env_file: .env
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1
    volumes: ["./models:/models:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  postgres-data:
  redis-data:
  minio-data:
